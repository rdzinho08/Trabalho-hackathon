 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Segura - Login</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container">
        <div class="card">
            
            <div class="card-header">
                <span class="material-symbols-outlined logo-icon">admin_panel_settings</span>
                <h1>Cidade Segura</h1>
                <p class="subtitle">Autenticação de Usuário</p>
            </div>

            <form action="index.html" method="GET">
                <div class="input-group">
                    <label for="email">E-mail Cadastrado</label>
                    <div class="input-field">
                        <span class="material-symbols-outlined input-icon">mail</span>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                        <label for="password" style="margin-bottom: 0;">Senha</label>
                        <a href="#" style="color: #38bdf8; font-size: 12px; text-decoration: none; font-weight: 500;">Esqueceu a senha?</a>
                    </div>
                    <div class="input-field">
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="material-symbols-outlined">login</span>
                    Entrar no Sistema
                </button>
            </form>

            <div class="center-link">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
            </div>

            <div class="card-footer">
                <span class="status-indicator"></span> Terminal Seguro Criptografado
            </div>
            <script src="js/login.js"></script>
</body>
</html>
